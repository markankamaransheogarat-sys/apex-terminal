<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="crt-bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#111722" />
      <stop offset="100%" stop-color="#040608" />
    </radialGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffbb33" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#crt-bg)" stroke="#ff9900" stroke-width="8" />
  <polyline points="96,350 180,240 260,290 340,160 416,210" fill="none" stroke="#00d8ff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <polygon points="256,90 390,370 122,370" fill="none" stroke="url(#amber-glow)" stroke-width="20" stroke-linejoin="round" filter="url(#bloom)" />
  <circle cx="256" cy="270" r="32" fill="#ff9900" filter="url(#bloom)" />
  <text x="256" y="440" font-family="monospace" font-size="44" font-weight="900" fill="#ff9900" text-anchor="middle" letter-spacing="6">APEX</text>
</svg>
